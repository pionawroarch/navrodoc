name: Buduj navro. dokumentacja (.exe)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Utworzyć wydanie (Release) z wersją z package.json'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: navro-dokumentacja-windows
          path: dist/*.exe
      - name: Wersja
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          target_commitish: ${{ github.sha }}
          name: navro. dokumentacja ${{ steps.ver.outputs.v }}
          files: |
            dist/*.exe
            wtyczka-sketchup/navro_dokumentacja.rbz
